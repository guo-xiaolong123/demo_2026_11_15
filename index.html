<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="description" content="曲阜旅游指南——地图定位、景点标注、详情导览一站式旅游助手">
<title>曲阜旅游指南 · 圣城漫游记</title>
<style>
  :root {
    --ink: #231a1a;
    --red-deep: #8f1d22;
    --red: #b8352e;
    --gold: #f5c042;
    --gold-deep: #c9932a;
    --paper: #fbf6ec;
    --blue: #2f6df6;
    --shadow: 0 6px 24px rgba(35, 26, 26, .14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-bottom: 84px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ===== 顶部国风渐变横幅 ===== */
  .hero {
    position: relative;
    padding: calc(env(safe-area-inset-top) + 22px) 20px 20px;
    background:
      radial-gradient(circle at 85% 15%, rgba(245, 192, 66, .35), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(255, 120, 70, .3), transparent 50%),
      linear-gradient(140deg, #6d1216, #8f1d22 40%, #c84b31);
    color: #fff;
    border-radius: 0 0 26px 26px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .hero::before {
    content: "曲";
    position: absolute;
    right: -8px;
    top: -30px;
    font-size: 150px;
    font-weight: 900;
    color: rgba(245, 192, 66, .16);
    font-family: "STKaiti", "KaiTi", serif;
    pointer-events: none;
  }
  .hero h1 {
    font-size: 26px;
    letter-spacing: 2px;
    font-family: "STKaiti", "KaiTi", serif;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(245, 192, 66, .6);
  }
  .hero p.sub {
    margin-top: 6px;
    font-size: 13px;
    opacity: .92;
    letter-spacing: 1px;
  }
  .hero .stats {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .hero .stats span {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(245, 192, 66, .45);
    backdrop-filter: blur(6px);
    color: #ffe9b0;
  }
  .hero .notice {
    display: none;
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, .28);
    border: 1px dashed rgba(245, 192, 66, .6);
    color: #ffd98a;
  }
             
  /* ===== 分类筛选条 ===== */
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 16px 6px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    border: 1px solid #e8dcc3;
    background: #fff;
    color: #7a5b3a;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s;
  }
  .chip.on {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    border-color: transparent;
    color: #5a3a00;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(245, 192, 66, .5);
    transform: translateY(-1px);
  }

  /* ===== 地图区域 ===== */
  .map-wrap {
    position: relative;
    margin: 10px 16px 0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid #eeddb8;
    height: 58vh;
    min-height: 380px;
  }
  #mapContainer { width: 100%; height: 100%; }
  .map-tip {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 99;
    display: none;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .9);
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
    color: #7a5b3a;
    line-height: 1.6;
  }
  .locate-btn {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 99;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    box-shadow: 0 4px 14px rgba(245, 192, 66, .55);
    font-size: 24px;
    cursor: pointer;
    transition: transform .15s;
  }
  .locate-btn:active { transform: scale(.9); }
  .locate-btn.pinging::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 3px solid rgba(245, 192, 66, .8);
    animation: ping 1s infinite;
  }
  @keyframes ping {
    to { transform: scale(1.5); opacity: 0; }
  }
  .key-error {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #fbf6ec;
    text-align: center;
    font-size: 14px;
    line-height: 1.8;
    color: #7a5b3a;
  }

  /* ===== 地图自定义标记 ===== */
  .mk {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .25));
  }
  .mk b {
    width: 38px;
    height: 38px;
    border-radius: 50% 50% 50% 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    transform: rotate(45deg);
    border: 2.5px solid #fff;
  }
  .mk b s {
    text-decoration: none;
    transform: rotate(-45deg);
  }
  .mk i {
    font-style: normal;
    font-size: 11px;
    margin-top: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(35, 26, 26, .78);
    color: #ffe9b0;
    white-space: nowrap;
    border: 1px solid rgba(245, 192, 66, .4);
  }
  .mk.cat-guwen b { background: linear-gradient(135deg, #c84b31, #8f1d22); }
  .mk.cat-bowuguan b { background: linear-gradient(135deg, #5b8def, #2f56c9); }
  .mk.cat-ziran b { background: linear-gradient(135deg, #3fbf7f, #1d8a54); }
  .mk.cat-jingqu b { background: linear-gradient(135deg, #b07ce8, #7a3fd1); }
  .mk.cat-meishi b { background: linear-gradient(135deg, #f5a623, #e07b12); }
  .mk.me { transform-origin: center; animation: mePulse 1.6s infinite; }
  @keyframes mePulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(47, 109, 246, 0)); }
    50% { filter: drop-shadow(0 0 10px rgba(47, 109, 246, .8)); }
  }

  /* ===== 景点信息浮窗(地图) ===== */
  .iw {
    max-width: 240px;
    font-family: inherit;
  }
  .iw .iw-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .iw .iw-emoji {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: linear-gradient(135deg, #f7e6bd, #eeddb8);
  }
  .iw h4 { font-size: 15px; color: #231a1a; }
  .iw .iw-rate {
    font-size: 11px;
    color: #c9932a;
    letter-spacing: 1px;
  }
  .iw p {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.7;
    color: #6b5b4a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .iw .iw-btns {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .iw .iw-btns a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    padding: 7px 0;
    border-radius: 8px;
    transition: opacity .2s;
  }
  .iw .iw-btns a:active { opacity: .7; }
  .iw .btn-nav {
    color: #fff;
    background: linear-gradient(135deg, #c84b31, #8f1d22);
  }
  .iw .btn-detail {
    color: #8f1d22;
    border: 1.5px solid #c84b31;
    background: #fff;
  }

  /* ===== 景点列表卡片 ===== */
  .list-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 22px 20px 8px;
  }
  .list-head h2 {
    font-size: 19px;
    font-family: "STKaiti", "KaiTi", serif;
  }
  .list-head span { font-size: 12px; color: #a58b62; }
  .cards { padding: 4px 16px 20px; display: grid; gap: 12px; }
  .card {
    display: flex;
    gap: 12px;
    padding: 14px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid #f0e4c8;
    box-shadow: 0 2px 10px rgba(143, 100, 30, .07);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    animation: cardIn .5s both;
  }
  .card:active {
    transform: scale(.97);
    box-shadow: 0 6px 18px rgba(143, 100, 30, .18);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card .c-emoji {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: linear-gradient(135deg, #f9efdc, #f0e0be);
    border: 1px solid #ead9b4;
  }
  .card .c-body { flex: 1; min-width: 0; }
  .card .c-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h3 { font-size: 15.5px; }
  .card .c-tag {
    flex: none;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, #c84b31, #8f1d22);
  }
  .card .c-meta {
    font-size: 12px;
    color: #a58b62;
    margin-top: 4px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card .c-desc {
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #7a6a52;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .c-dist {
    margin-top: 8px;
    font-size: 12px;
    color: var(--blue);
    font-weight: 600;
  }

  /* ===== 详情底部弹层 ===== */
  .detail-mask,
  .detail {
    position: fixed;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .3s;
  }
  .detail-mask {
    inset: 0;
    background: rgba(20, 12, 8, .55);
    backdrop-filter: blur(3px);
  }
  .detail {
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 24px 24px 0 0;
    max-height: 82vh;
    overflow-y: auto;
    padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
  }
  .detail-mask.show, .detail.show {
    opacity: 1;
    pointer-events: auto;
  }
  .detail.show { transform: translate(-50%, 0); }
  .d-head {
    padding: 26px 20px 18px;
    color: #fff;
    position: relative;
  }
  .d-head .d-emoji { font-size: 40px; }
  .d-head h3 {
    font-size: 22px;
    margin-top: 6px;
    font-family: "STKaiti", "KaiTi", serif;
    letter-spacing: 1px;
  }
  .d-head .d-rate { font-size: 13px; margin-top: 4px; color: #ffe9b0; }
  .d-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    color: #fff;
    font-size: 17px;
    cursor: pointer;
  }
  .d-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 14px 20px 0;
  }
  .d-tags span {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: #f9efdc;
    color: #8a6420;
    border: 1px solid #ecd9a8;
  }
  .d-rows { padding: 14px 20px 0; }
  .d-rows div {
    display: flex;
    gap: 10px;
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px dashed #f0e4c8;
    color: #5f4d38;
  }
  .d-rows div:last-child { border: none; }
  .d-rows b { flex: none; font-weight: 400; }
  .d-desc {
    margin: 12px 20px 0;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.8;
    color: #5f4d38;
    background: #fbf4e2;
    border-radius: 14px;
  }
  .d-tip {
    margin: 12px 20px 0;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #8a5a00;
    background: linear-gradient(135deg, #fff4d6, #ffe9b0);
    border-radius: 14px;
    border: 1px dashed #e5c46a;
  }
  .d-tip b { color: #b8730c; }
  .d-cta {
    display: block;
    margin: 18px 20px 0;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(135deg, #c84b31, #8f1d22);
    border-radius: 14px;
    box-shadow: 0 5px 16px rgba(184, 53, 46, .4);
  }
  .d-cta:active { opacity: .8; }

  /* ===== 底部导航 ===== */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 560px;
    z-index: 150;
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(255, 252, 244, .96);
    backdrop-filter: blur(12px);
    border-top: 1px solid #f0e4c8;
  }
  .tabbar a {
    flex: 1;
    text-align: center;
    padding: 9px 0 8px;
    text-decoration: none;
    color: #b3a184;
    font-size: 11px;
  }
  .tabbar a span { display: block; font-size: 21px; }
  .tabbar a.on { color: #b8352e; font-weight: 600; }

  /* ===== 提示条 ===== */
  #toast {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    z-index: 300;
    max-width: 86%;
    padding: 10px 18px;
    border-radius: 12px;
    background: rgba(35, 26, 26, .88);
    color: #ffe9b0;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all .3s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 560px) {
    body { box-shadow: 0 0 40px rgba(143, 100, 30, .12); min-height: 100vh; }
  }

  /* ===== 桌面端自动适配：≥1024px 宽屏自动切换双栏布局 ===== */
  @media (min-width: 1024px) {
    body { max-width: 1200px; }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 4px 28px;
      align-items: start;
      padding: 0 8px;
    }
    .content .chips { grid-column: 1; grid-row: 1; overflow: visible; flex-wrap: wrap; }
    .content .map-wrap { grid-column: 1; grid-row: 2; height: 74vh; min-height: 560px; margin: 10px 0 0; }
    .content section { grid-column: 2; grid-row: 1 / 3; padding-top: 14px; }
    .hero h1 { font-size: 30px; }
    .tabbar { max-width: 1200px; }
  }
</style>
</head>

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
function toast(msg, ms = 2600) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), ms);
}
function distText(pos) {
  if (!window._myPos) return "";
  const R = 6371000, toR = x => x * Math.PI / 180;
  const [lon1, lat1] = window._myPos, [lon2, lat2] = pos;
  const dLat = toR(lat2 - lat1), dLon = toR(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLon/2)**2;
  let m = Math.round(2 * R * Math.asin(Math.sqrt(a)));
  return m < 1000 ? `距你 ${m} 米` : `距你 ${(m/1000).toFixed(1)} 公里`;
}
function navUrl(spot) {
  return `https://uri.amap.com/marker?position=${spot.pos[0]},${spot.pos[1]}&name=${encodeURIComponent(spot.name)}`;
}

/* ---------- 地图加载（Key 校验） ---------- */
if (!AMAP_KEY || AMAP_KEY.includes("这里填")) {
  $("#keyError").style.display = "flex";
} else {
  const sc = document.createElement("script");
  sc.src = `https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}`;
  sc.onerror = () => $("#keyError").style.display = "flex";
  document.head.appendChild(sc);
  const guard = setTimeout(() => {
    if (!window.AMap) $("#keyError").style.display = "flex";
  }, 6000);
  sc.onload = () => {
    clearTimeout(guard);
    if (!window.AMap) {
      showMapErr("高德脚本已加载但初始化失败：<b>Key 无效或类型不匹配</b>（服务端返回 Error key）。请检查 Key 是否完整复制（32 位）、绑定服务是否为「Web端(JS API)」");
      return;
    }
    initApp();
  }
}

/* ---------- 主程序 ---------- */
let map, markers = {}, infoWin, userMarker, accCircle;

function showMapErr(msg) {
  const ke = $("#keyError");
  ke.innerHTML =
    '<div style="font-size:13px;line-height:2">🗺️ <b>地图加载失败</b><br>' + msg +
    '<br>请按 <b>F12</b> 打开浏览器控制台（Console 标签），<br>把<b style="color:#b8352e">红色报错文字</b>截图发给开发者即可定位原因。</div>';
  ke.style.display = "flex";
}

window.addEventListener("error", e => {
  if (window._mapReady || !e.message) return;
  showMapErr("页面脚本错误：" + e.message);
});

function initApp() {
  map = new AMap.Map("mapContainer", {
    center: [116.99, 35.596],
    zoom: 13.4,
    mapStyle: "amap://styles/macaron",
    resizeEnable: true
  });
  map.on("complete", () => { window._mapReady = true; });
  map.on("error", err => showMapErr("高德返回错误：" + ((err && (err.msg || err.message)) || JSON.stringify(err || {}))));
  setTimeout(() => {
    if (!window._mapReady) {
      showMapErr(
        "地图瓦片 10 秒内未加载，常见原因：<br>" +
        "① 用本地双击（file://）方式预览，高德安全校验受限——请上传服务器后用 http://39.96.33.211/ 访问；<br>" +
        "② Key 的绑定服务不是「Web端(JS API)」；<br>③ 网络波动，请刷新重试。"
      );
    }
  }, 10000);
  if (location.protocol === "file:") {
    showMapTip("⚠ 本地 file:// 预览模式：高德安全校验可能受限，地图如未显示请上传服务器后测试");
    setTimeout(hideMapTip, 6000);
  }
  infoWin = new AMap.InfoWindow({ isCustom: true, offset: new AMap.Pixel(0, -46) });

  SPOTS.forEach(s => {
    const cat = CATS[s.cat];
    const el = document.createElement("div");
    el.className = `mk cat-${s.cat}`;
    el.innerHTML = `<b><s>${s.emoji}</s></b><i>${s.name}</i>`;
    const mk = new AMap.Marker({
      position: s.pos,
      content: el,
      offset: new AMap.Pixel(-19, -44),
      map
    });
    mk.on("click", () => openInfo(s));
    markers[s.id] = mk;
  });

  if (!window.isSecureContext) {
    $("#httpNotice").style.display = "block";
    showMapTip("⚠ HTTP 模式：GPS 精确定位受限，点击 📍 使用城市级定位，之后可点击地图手动修正位置");
    setTimeout(hideMapTip, 7000);
  }

  /* 手动选点模式：点击地图设置"我的位置" */
  map.on("click", e => {
    if (!window._manualPick) return;
    window._manualPick = false;
    hideMapTip();
    setMyPos([e.lnglat.getLng(), e.lnglat.getLat()], null);
    toast("✅ 已手动设置“我的位置”，各景点距离已更新");
  });

  buildChips();
  buildCards();
}

function openInfo(s) {
  const cat = CATS[s.cat];
  const d = distText(s.pos);
  infoWin.setContent(`
    <div class="iw">
      <div class="iw-top">
        <div class="iw-emoji">${s.emoji}</div>
        <div>
          <h4>${s.name}</h4>
          <div class="iw-rate">★ ${s.rate} · ${cat.name}</div>
        </div>
      </div>
      <p>${s.desc}</p>
      ${d ? `<div style="margin-top:6px;font-size:12px;color:#2f6df6;font-weight:600">${d}</div>` : ""}
      <div class="iw-btns">
        <a class="btn-nav" href="${navUrl(s)}" target="_blank">🧭 导航前往</a>
        <a class="btn-detail" href="javascript:void(0)" onclick="openDetail(${s.id})">详情</a>
      </div>
    </div>`);
  infoWin.open(map, s.pos);
}

function buildChips() {
  const box = $("#chips");
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.className = "chip" + (key === "all" ? " on" : "");
    b.textContent = label;
    b.onclick = () => {
      box.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      filterCat(key);
    };
    box.appendChild(b);
  };
  mk("all", "全部");
  Object.keys(CATS).forEach(k => mk(k, `${CATS[k].emoji} ${CATS[k].name}`));
}

function filterCat(cat) {
  Object.values(markers).forEach(m => map.remove(m));
  const list = SPOTS.filter(s => cat === "all" || s.cat === cat);
  list.forEach(s => map.add(markers[s.id]));
  buildCards(cat);
  if (list.length) map.setFitView(null, false, [70, 70, 70, 70]);
}

function buildCards(cat = "all") {
  const box = $("#cards");
  box.innerHTML = "";
  SPOTS.filter(s => cat === "all" || s.cat === cat).forEach((s, i) => {
    const c = CATS[s.cat];
    const el = document.createElement("div");
    el.className = "card";
    el.style.animationDelay = `${i * 60}ms`;
    el.innerHTML = `
      <div class="c-emoji">${s.emoji}</div>
      <div class="c-body">
        <div class="c-row"><h3>${s.name}</h3><span class="c-tag">${s.tag.split(" ")[0]}</span></div>
        <div class="c-meta"><span>★ ${s.rate}</span><span>${c.name}</span><span>${s.price}</span></div>
        <div class="c-desc">${s.desc}</div>
        <div class="c-dist" data-spot="${s.id}">${distText(s.pos) || "定位后显示距离"}</div>
      </div>`;
    el.onclick = () => {
      map.setZoomAndCenter(15, s.pos);
      openInfo(s);
      $(".map-wrap").scrollIntoView({ behavior: "smooth" });
    };
    box.appendChild(el);
  });
}

/* ---------- 详情弹层 ---------- */
window.openDetail = id => {
  infoWin && infoWin.close();
  const s = SPOTS.find(x => x.id === id);
  const c = CATS[s.cat];
  const grads = {
    guwen: "linear-gradient(135deg,#6d1216,#c84b31)",
    bowuguan: "linear-gradient(135deg,#1c3fa0,#5b8def)",
    ziran: "linear-gradient(135deg,#0f6e3e,#3fbf7f)",
    jingqu: "linear-gradient(135deg,#4b1d8a,#b07ce8)",
    meishi: "linear-gradient(135deg,#b35a00,#f5a623)"
  };
  $("#detail").innerHTML = `
    <div class="d-head" style="background:${grads[s.cat]}">
      <button class="d-close" onclick="closeDetail()">✕</button>
      <div class="d-emoji">${s.emoji}</div>
      <h3>${s.name}</h3>
      <div class="d-rate">★ ${s.rate} 分 · ${c.name}</div>
    </div>
    <div class="d-tags">
      <span>🏅 ${s.tag}</span><span>🎫 ${s.price}</span><span>🕘 ${s.time}</span>
    </div>
    <div class="d-rows">
      <div><b>📍 地址</b>${s.addr}</div>
      <div><b>📏 距离</b><span id="dDist">${distText(s.pos) || "定位后显示距离"}</span></div>
      <div><b>🧭 坐标</b>${s.pos[0]}, ${s.pos[1]}</div>
    </div>
    <div class="d-desc">${s.desc}</div>
    <div class="d-tip"><b>💡 游玩贴士</b><br>${s.tip}</div>
    <a class="d-cta" href="${navUrl(s)}" target="_blank">🧭 导航前往 ${s.name}</a>`;
  $("#detailMask").classList.add("show");
  $("#detail").classList.add("show");
};
window.closeDetail = () => {
  $("#detailMask").classList.remove("show");
  $("#detail").classList.remove("show");
};
$("#detailMask").onclick = closeDetail;

/* ---------- 定位 ---------- */
function showMapTip(html) { const t = $("#mapTip"); t.innerHTML = html; t.style.display = "block"; }
function hideMapTip() { $("#mapTip").style.display = "none"; }

function setMyPos(lnglat, accuracy) {
  window._myPos = lnglat;
  if (userMarker) map.remove(userMarker);
  if (accCircle) map.remove(accCircle);
  const el = document.createElement("div");
  el.className = "mk me";
  el.innerHTML = `<b style="background:linear-gradient(135deg,#5b8def,#2f56c9)"><s>🧍</s></b><i>我的位置</i>`;
  userMarker = new AMap.Marker({ position: lnglat, content: el, offset: new AMap.Pixel(-19, -44), map });
  if (accuracy) {
    accCircle = new AMap.Circle({
      center: lnglat, radius: accuracy, strokeColor: "#2f6df6", strokeWeight: 1,
      strokeOpacity: .5, fillColor: "#2f6df6", fillOpacity: .12, map
    });
  }
  document.querySelectorAll(".c-dist").forEach(el => {
    const s = SPOTS.find(x => x.id == el.dataset.spot);
    if (s) el.textContent = distText(s.pos);
  });
  const dEl = $("#dDist");
  if (dEl && $("#detail h3")) {
    const s = SPOTS.find(x => x.name === $("#detail h3").textContent);
    if (s) dEl.textContent = distText(s.pos);
  }
}

$("#locateBtn").onclick = () => {
  if (!window.AMap || !map) return;
  const btn = $("#locateBtn");
  btn.classList.add("pinging");
  showMapTip("📡 正在定位…");
  window._manualPick = false;
  const done = () => btn.classList.remove("pinging");

  /* 兜底：手动点选"我的位置" */
  const manualPick = hint => {
    window._manualPick = true;
    showMapTip("✋ " + hint + "<br><b>请点击地图上你所在的位置</b>（可先放大到街道再点）");
    toast("已进入手动选点模式：点击地图任意位置即可设为“我的位置”", 4000);
  };

  /* IP 城市级定位（HTTP 环境的主定位方式） */
  const ipLocate = () => {
    AMap.plugin("AMap.Geolocation", () => {
      const geo = new AMap.Geolocation({ timeout: 8000 });
      geo.getCityInfo((st, res) => {
        done();
        if (st === "complete" && res && res.center) {
          map.setZoomAndCenter(12.6, res.center);
          showMapTip(
            `📡 <b>高德城市级定位</b>：${res.province || ""}${res.city || ""}（IP 定位精度所限）<br>` +
            `手机 GPS 可达米级精度；当前环境可点击地图手动校正位置。`
          );
          setTimeout(() => {
            hideMapTip();
            manualPick("如需计算景点距离，可在地图上手动校正你的位置");
          }, 3500);
        } else {
          manualPick("定位服务暂不可用（可能是网络原因）");
        }
      });
    });
  };

  if (window.isSecureContext) {
    /* HTTPS / localhost：尝试浏览器精确定位，失败自动降级 */
    AMap.plugin("AMap.Geolocation", () => {
      const geo = new AMap.Geolocation({
        enableHighAccuracy: true,
        timeout: 9000,
        showButton: false,
        GeoLocationFirst: true
      });
      geo.getCurrentPosition((status, result) => {
        if (status === "complete" && result.position) {
          const acc = result.accuracy || 0;
          if (acc > 5000) {
            /* 浏览器返回的是 IP 猜测位（误差上万米，不可信）→ 改用高德自家定位库 */
            showMapTip("⚠ 浏览器 IP 定位误差较大（约 " + (acc / 1000).toFixed(0) + " 公里），正在改用高德定位库校准…");
            ipLocate();
          } else {
            done();
            setMyPos([result.position.lng, result.position.lat], acc);
            map.setZoomAndCenter(15, [result.position.lng, result.position.lat]);
            hideMapTip();
            toast(`✅ 定位成功！误差约 ${Math.round(acc)} 米`);
          }
        } else {
          ipLocate();
        }
      });
    });
  } else {
    /* HTTP：浏览器禁止 GPS，直接用 IP 定位 */
    ipLocate();
  }
};

/* ---------- 底部导航（预留扩展） ---------- */
document.querySelectorAll(".tabbar a").forEach(a => {
  a.onclick = () => {
    if (a.classList.contains("on")) return;
    toast(`「${a.textContent.slice(1)}」功能开发中，下一版上线，敬请期待 🚧`);
  };
});
